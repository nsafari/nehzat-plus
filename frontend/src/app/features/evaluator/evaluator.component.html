<main class="role-page">
  <div class="toast" *ngIf="toast" [ngClass]="'toast-' + toast.type">{{ toast.message }}</div>

  <header class="site-header">
    <div class="brand-wrap">
      <img src="assets/nehzat.png" alt="لوگو سایت" class="site-logo" [hidden]="logoHidden" (error)="logoHidden = true" />
      <div>
        <h1>داشبورد ارزیاب</h1>
        <p class="muted">خوش آمدید {{ currentUser?.username }}</p>
      </div>
    </div>
    <div class="user-menu">
      <button type="button" class="menu-trigger" (click)="logout()">خروج</button>
    </div>
  </header>

  <nav class="sub-nav">
    <a class="sub-nav-link" routerLink="/evaluator/queue" routerLinkActive="sub-nav-link-active"
       [routerLinkActiveOptions]="{ exact: true }">فهرست ارزیابی</a>
    <a class="sub-nav-link" routerLink="/evaluator/form" routerLinkActive="sub-nav-link-active">فرم ارزیابی</a>
    <a class="sub-nav-link" routerLink="/evaluator/review" routerLinkActive="sub-nav-link-active">بازبینی ارزیابی</a>
    <a class="sub-nav-link" routerLink="/evaluator/analytics" routerLinkActive="sub-nav-link-active">تحلیل ارزیابیها</a>
  </nav>

  <div class="shell-content">
    <router-outlet />
  </div>
</main>
